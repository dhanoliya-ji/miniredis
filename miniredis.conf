# MiniRedis sample configuration.
#
#   miniredis-server miniredis.conf
#   miniredis-server miniredis.conf --port 6390     # flags after the file win
#
# Every directive here is also accepted on the command line with a leading
# '--', and at runtime through CONFIG SET. All three share one implementation,
# so they cannot drift into accepting different syntax for the same setting.
#
# See docs/CONFIGURATION.md for the full reference.

# ---------------------------------------------------------------------------
# Networking
# ---------------------------------------------------------------------------

# Loopback only, deliberately. A database reachable from the network without a
# password is how data leaks. Set 0.0.0.0 only together with requirepass.
bind 127.0.0.1

# 6380 rather than 6379, so MiniRedis can run alongside a real Redis.
port 6380

tcp-backlog 511

# Seconds before an idle client is dropped; 0 disables. Replicas and
# subscribers are exempt, since they are legitimately idle for long stretches.
timeout 0

maxclients 10000

# Name used in logs, INFO and the cluster config.
nodeid miniredis

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------

# Where the snapshot, the append-only log and the cluster config live.
dir ./data

databases 16

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------

# Uncomment to require AUTH before any command. Do this before binding to
# anything other than loopback.
# requirepass change-this-before-exposing-the-port

# ---------------------------------------------------------------------------
# Memory
# ---------------------------------------------------------------------------

# 0 means unlimited, which means the server will grow until the machine runs
# out. Set a real limit before relying on this as a cache; MEMORY DOCTOR will
# tell you the same thing.
maxmemory 0

# What to do when the limit is hit. The choice is really a question about what
# the data is:
#
#   a cache      -> allkeys-lru / allkeys-lfu   (evict; it can be refetched)
#   a datastore  -> noeviction                  (refuse; deleting data is worse)
#   mixed        -> volatile-*                  (TTL marks what is disposable)
#
# Options: noeviction, allkeys-lru, allkeys-lfu, allkeys-random,
#          volatile-lru, volatile-lfu, volatile-random, volatile-ttl
maxmemory-policy noeviction

# Keys sampled per eviction round. Five lands within a few percent of exact
# LRU; exact LRU would cost two pointers on every key.
maxmemory-samples 5

# ---------------------------------------------------------------------------
# Persistence: the append-only log
# ---------------------------------------------------------------------------

appendonly no
appendfilename miniredis.aof

# The durability dial. write() only reaches the OS page cache, so a power cut
# loses whatever is still sitting in it:
#
#   always    nothing acknowledged is at risk; a disk round trip per iteration
#   everysec  up to one second at risk; negligible cost -- the knee of the curve
#   no        whatever the OS has not flushed is lost; free
appendfsync everysec

# Rewrite the log into the shortest command sequence that reproduces the
# dataset once it has grown this much since the last rewrite, but never below
# the minimum size.
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ---------------------------------------------------------------------------
# Persistence: snapshots
# ---------------------------------------------------------------------------

dbfilename miniredis.rdb

# "save <seconds> <changes>" -- snapshot if at least <changes> keys changed in
# the last <seconds>. Repeated lines accumulate. A bare "save" with no
# arguments disables snapshotting entirely.
save 900 1
save 300 100
save 60 10000

load-on-startup yes

# ---------------------------------------------------------------------------
# Replication
# ---------------------------------------------------------------------------

# Follow another node. Uncomment on a replica.
# replicaof 127.0.0.1 6380
# masterauth change-this-before-exposing-the-port

# Leave this on. A write accepted on a replica diverges it from its master, and
# the next resynchronisation silently discards it.
replica-read-only yes

repl-timeout 60

# How much of the recent write stream to keep for partial resynchronisation.
# This directly buys reconnect resilience: at 100 KB/s of writes, 1 MB covers a
# ten-second outage without a full dataset transfer.
repl-backlog-size 1mb

# ---------------------------------------------------------------------------
# Cluster
# ---------------------------------------------------------------------------

cluster-enabled no
cluster-config-file nodes.conf

# Address advertised to clients, when the node sits behind NAT.
# cluster-announce-ip 203.0.113.10
# cluster-announce-port 6380

# ---------------------------------------------------------------------------
# Observability
# ---------------------------------------------------------------------------

# debug, verbose, notice, warning
loglevel notice

# Empty means stdout.
# logfile miniredis.log

# Microseconds. This matters more here than on a threaded server: one slow
# command blocks every client, so finding it is the difference between a
# diagnosis and a guess. -1 disables.
slowlog-log-slower-than 10000
slowlog-max-len 128
