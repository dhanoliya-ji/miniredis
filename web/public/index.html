<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MiniRedis Console</title>
    <meta
      name="description"
      content="A live console for MiniRedis, a Redis-style in-memory database written from scratch in C++20. Commands are sent over real RESP2."
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>&#128190;</text></svg>" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="dot" id="status-dot"></span>
        <h1>MiniRedis</h1>
        <span class="sub">console</span>
      </div>
      <div class="meta">
        <span id="status-text">connecting…</span>
        <a href="https://github.com/dhanoliya-ji/miniredis" target="_blank" rel="noreferrer">source</a>
      </div>
    </header>

    <main>
      <section class="terminal" aria-label="Console">
        <div id="out" class="out" role="log" aria-live="polite"></div>
        <form id="form" class="prompt">
          <span class="caret">&gt;</span>
          <input
            id="input"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="SET user:1 alice"
            aria-label="Command"
          />
          <button type="submit">Run</button>
        </form>
      </section>

      <aside>
        <div class="panel">
          <h2>Try it</h2>
          <p class="hint">
            Every command below is sent over real RESP2 to the C++ server — the same protocol
            <code>redis-cli</code> speaks.
          </p>
          <div id="tours"></div>
        </div>

        <div class="panel">
          <h2>Server</h2>
          <dl id="info" class="info"><dd class="muted">loading…</dd></dl>
        </div>

        <p class="footnote">
          Shared public instance, reset whenever it restarts. <code>SHUTDOWN</code>,
          <code>DEBUG</code>, <code>MONITOR</code>, replication and <code>CONFIG SET</code> are
          disabled here.
        </p>
      </aside>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
